<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container{
            width: 80%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: blue;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Registered Users</h2>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
            </tr>
        </thead>

        <tbody id="tableData"></tbody>

    </table>

</div>

<script>

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let tableData = document.getElementById("tableData");

    users.forEach(function(user){

        let row = `
            <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${user.password}</td>
            </tr>
        `;

        tableData.innerHTML += row;

    });

</script>

</body>
</html>
