<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h3>Dashboard</h3>

            <a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="#"><i class="bi bi-people"></i> Students</a>
            <a href="#"><i class="bi bi-book"></i> Courses</a>
            <a href="#"><i class="bi bi-file-earmark-text"></i> Exams</a>
            <a href="#"><i class="bi bi-cart"></i> Orders</a>
            <a href="#"><i class="bi bi-gear"></i> Settings</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <!-- Topbar -->
            <div class="topbar d-flex justify-content-between align-items-center">
                <h2>Admin Dashboard</h2>
                <button class="btn btn-primary">Logout</button>
            </div>

            <!-- Cards -->
            <div class="row g-4">

                <div class="col-md-3 col-sm-6">
                    <div class="card-box bg1">
                        <h4>1200</h4>
                        <p>Total Students</p>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card-box bg2">
                        <h4>85</h4>
                        <p>Total Courses</p>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card-box bg3">
                        <h4>35</h4>
                        <p>Upcoming Exams</p>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card-box bg4">
                        <h4>560</h4>
                        <p>New Orders</p>
                    </div>
                </div>

            </div>

            <!-- Table -->
            <div class="card mt-5">
                <div class="card-header bg-dark text-white">
                    Recent Activities
                </div>

                <div class="card-body table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>101</td>
                                <td>Rahul Sharma</td>
                                <td>Computer</td>
                                <td><span class="badge bg-success">Active</span></td>
                            </tr>

                            <tr>
                                <td>102</td>
                                <td>Priya Patil</td>
                                <td>IT</td>
                                <td><span class="badge bg-warning">Pending</span></td>
                            </tr>

                            <tr>
                                <td>103</td>
                                <td>Amit Joshi</td>
                                <td>ENTC</td>
                                <td><span class="badge bg-danger">Blocked</span></td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
